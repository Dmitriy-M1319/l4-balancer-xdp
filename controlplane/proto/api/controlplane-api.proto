syntax="proto3";

package api;

option go_package = "github.com/Dmitriy-M1319/l4-controlplane/api;api";

service L4BalancerApi {
    rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
    rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse);
    rpc ListServices(ListServicesRequest) returns (ListServicesResponse);
    rpc ListBackends(ListBackendsRequest) returns (ListBackendsResponse);
    rpc SetBackendStatus(SetBackendStatusRequest) returns (SetBackendStatusResponse);
}

message GetConfigRequest {}

message Backend {
    string ip = 1;
    uint32 port = 2;
    uint32 weight = 3;
    bool enabled = 4;
    uint32 ip_version = 5;
}

message Service {
    string name = 1;
    string vip = 2;
    uint32 port = 3;
    string protocol = 4;          // "tcp" или "udp"
    uint32 ip_version = 5;        // 4 или 6
    string algorithm = 6;
    repeated Backend backends = 7;  
}

message Configuration {
    repeated Service services = 1;
}

message GetConfigResponse {
    Configuration config = 1;
}

message UpdateConfigRequest {
    Configuration config = 1;
}

message UpdateConfigResponse {
    bool success = 1;
    repeated string errors = 2;    // Ошибки валидации (если есть)
}

message ServiceFilter {
    optional string protocol = 1;  // Фильтр по протоколу
    bool enabled_only = 2;
    optional uint32 ip_version = 3; 
}

message ListServicesRequest {
    ServiceFilter filter = 1;
    bool include_backends = 2;
    bool include_metrics = 3;
}

message BackendInfo {
    string ip = 1;
    uint32 port = 2;
    uint32 weight = 3;
    bool enabled = 4;
    optional ServiceMetrics metrics = 5;
}

message ServiceInfo {
    string name = 1;
    string vip = 2;
    uint32 port = 3;
    string protocol = 4;
    repeated BackendInfo backends = 5;
    optional ServiceMetrics metrics = 6;
}

message ListServicesResponse {
    repeated ServiceInfo services = 1;
}

message SetBackendStatusRequest {
    string service_name = 1;
    string vip = 2;
    uint32 service_port = 3;
    string backend_ip = 4;
    uint32 backend_port = 5;
    bool status = 6;
}

message SetBackendStatusResponse {
    bool success = 1;
    optional string error = 2;
}

message ListBackendsRequest {
    bool include_metrics = 1;
}

message ListBackendsResponse {
    repeated BackendInfo backends = 1;
}

message ServiceMetrics {
    uint64 total_packets = 1;
    uint64 tcp_syn_packets = 2;
    uint64 prepared_packets = 3;
    uint32 active_connections = 4;
    uint64 total_bytes = 5;
}
